name: Image verification (manual, no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AUDIT_IMAGE: hachimi-competition-audit:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.AUDIT_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Audit image and run container smoke
        run: bash ./deploy/verify-competition-image.sh "$AUDIT_IMAGE"

      - name: Validate Caddyfile
        run: >-
          docker run --rm
          --env APP_DOMAIN=localhost
          --env ACME_EMAIL=ci@example.invalid
          --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.0-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate Compose configuration
        env:
          HACHIMI_IMAGE: ${{ env.AUDIT_IMAGE }}
          APP_DOMAIN: localhost
          ACME_EMAIL: ci@example.invalid
        run: |
          set -Eeuo pipefail
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /opt/hachimi/shared
          install -m 0600 /dev/null /opt/hachimi/shared/.env.production
          rendered="$(docker compose --file deploy/compose.yml config --no-env-resolution --format json)"
          jq --exit-status '.services.app.stop_grace_period == "4m0s"' <<<"$rendered"

