# Include inside the existing caohonglin.fun HTTPS server block.
location = /trainpal {
    return 308 /trainpal/;
}

# Manifest-backed, authorized controlled media only. Never an upload directory.
location ^~ /trainpal/media/ {
    alias /var/lib/trainpal/media/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /trainpal/ {
    # Strip the mount prefix; ASGI upload/admission middleware sees /api/v1/.
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection '';
    client_max_body_size 65m;
    client_body_timeout 120s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 650s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
}
