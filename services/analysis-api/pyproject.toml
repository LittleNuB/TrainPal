[project]
name = "hachimi-analysis-api"
version = "0.1.0"
description = "Transient action-analysis API for Hachimi Fitness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.0,<1",
  "imageio-ffmpeg>=0.6.0,<1",
  "jsonschema==4.25.1",
  "pydantic-settings>=2.10.0,<3",
  "python-dotenv>=1.1.0,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35.0,<1",
  "websockets>=15.0.0,<17",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1.0,<3",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.1.0,<2",
  "respx>=0.22.0,<1",
  "ruff>=0.12.0,<1",
  "types-jsonschema>=4.23.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hakimi_analysis"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "imageio_ffmpeg"
ignore_missing_imports = true
